name: Windows build (cheat-peek)

# Builds a ready-to-run Windows zip of this branch and attaches it to the
# workflow run, so the patched game can be downloaded from the Actions tab.

on:
  push:
    branches: [ cheat-peek, 'cheat-peek-*' ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows zip
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc-mingw-w64 automake autoconf git make zip

      # Need commit history and tags for scripts/version.sh to work.
      - name: Clone Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Release Tags
        run: git fetch --tags --force https://github.com/angband/angband.git

      - name: Build and Package
        id: package
        run: |
          ./autogen.sh
          env CFLAGS="-O2" ./configure --enable-release --enable-win --build=i686-pc-linux-gnu --host=i686-w64-mingw32
          make -j$(nproc)
          cp src/angband.exe src/win/dll/libpng12.dll src/win/dll/zlib1.dll .
          # The HTML manual is not built here; give the packager an empty one.
          mkdir -p docs/_build/html
          prefix=angband-`scripts/version.sh`
          echo "dir=$prefix" >> $GITHUB_OUTPUT
          scripts/pkg_win $prefix $prefix-win.zip
          # pkg_win removes the folder it zipped; unpack it again for upload.
          unzip -q $prefix-win.zip

      # Upload the unpacked folder: GitHub zips it once for download.
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.dir }}-win
          path: ${{ steps.package.outputs.dir }}
          retention-days: 90

      # Also put just the exe on its own branch, so it can be fetched with
      # plain git where the Actions artifact storage isn't reachable.
      - name: Publish exe to cheat-peek-exe branch
        if: github.ref == 'refs/heads/cheat-peek'
        run: |
          mkdir exe-branch
          cp src/angband.exe exe-branch/
          cd exe-branch
          git init -q -b cheat-peek-exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angband.exe
          git commit -q -m "angband.exe built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cheat-peek-exe
